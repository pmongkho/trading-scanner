<main class="min-h-screen bg-zinc-950 text-white grid place-items-center p-6">
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="w-full max-w-md space-y-4 rounded-2xl border border-zinc-800 bg-zinc-900 p-6"
  >
    <h1 class="text-2xl font-bold">Login</h1>

    <input
      type="email"
      formControlName="email"
      placeholder="Email"
      class="w-full rounded-lg bg-zinc-800 px-3 py-2 outline-none"
    />

    <input
      type="password"
      formControlName="password"
      placeholder="Password"
      class="w-full rounded-lg bg-zinc-800 px-3 py-2 outline-none"
    />

    <button
      type="submit"
      [disabled]="form.invalid || loading"
      class="w-full rounded-lg bg-white px-4 py-2 font-semibold text-black disabled:opacity-50"
    >
      {{ loading ? "Signing in..." : "Login" }}
    </button>

    @if (error) {
      <p class="text-sm text-red-400">{{ error }}</p>
    }
  </form>
</main>
